<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NL2SQL — Pipeline Live View</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --border: #2e3347;
    --accent: #4f8ef7;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --gray: #6b7280;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --code-bg: #12151f;
    --badge-running-bg: #1d3557;
    --badge-running-fg: #60a5fa;
    --badge-passed-bg: #14532d;
    --badge-passed-fg: #86efac;
    --badge-failed-bg: #450a0a;
    --badge-failed-fg: #fca5a5;
    --badge-skipped-bg: #1c1c2e;
    --badge-skipped-fg: #a78bfa;
    --badge-pending-bg: #1f2937;
    --badge-pending-fg: #9ca3af;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  header .spacer { flex: 1; }
  #traceIdBadge {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-dim);
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    display: none;
  }

  /* ── Layout ─────────────────────────────────────────────────────────── */
  .layout {
    display: flex;
    flex: 1;
    gap: 0;
    min-height: 0;
  }

  /* ── Input Panel (left) ──────────────────────────────────────────────── */
  .input-panel {
    width: 340px;
    min-width: 280px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 53px;
    height: calc(100vh - 53px);
    overflow-y: auto;
  }

  .input-panel label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 6px;
  }

  .input-panel input[type="text"],
  .input-panel textarea {
    width: 100%;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    resize: vertical;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .input-panel input:focus, .input-panel textarea:focus {
    border-color: var(--accent);
  }

  #questionInput {
    min-height: 80px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .toggle-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

  .btn-submit {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.15s;
  }
  .btn-submit:hover { opacity: 0.85; }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-clear {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-clear:hover { color: var(--text); border-color: var(--text-dim); }

  .status-indicator {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 20px;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Payload mode toggle */
  .payload-info {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    padding: 8px;
    background: #12151f;
    border-radius: 5px;
    border: 1px solid var(--border);
  }

  /* ── Timeline Panel (main) ───────────────────────────────────────────── */
  .timeline {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    gap: 12px;
    opacity: 0.5;
  }
  .placeholder-icon { font-size: 48px; }
  .placeholder-text { font-size: 15px; }

  /* ── Stage Card ─────────────────────────────────────────────────────── */
  .stage-card {
    position: relative;
    border-left: 2px solid var(--border);
    padding: 0 0 6px 20px;
    margin-left: 8px;
    animation: fadeIn 0.2s ease;
  }
  .stage-card:last-child { border-left-color: transparent; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Timeline dot */
  .stage-card::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 14px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--bg);
  }
  .stage-card.status-running::before  { background: var(--badge-running-fg); box-shadow: 0 0 6px var(--badge-running-fg); }
  .stage-card.status-passed::before   { background: var(--badge-passed-fg); }
  .stage-card.status-failed::before   { background: var(--badge-failed-fg); }
  .stage-card.status-skipped::before  { background: var(--badge-skipped-fg); }
  .stage-card.status-pending::before  { background: var(--badge-pending-fg); }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 6px;
    cursor: pointer;
    user-select: none;
  }
  .card-header:hover .stage-title { color: #fff; }

  .stage-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    transition: color 0.1s;
    flex: 1;
  }

  .stage-summary {
    font-size: 12px;
    color: var(--text-dim);
    padding-bottom: 2px;
    padding-left: 0;
    margin-bottom: 4px;
  }

  /* Status badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    white-space: nowrap;
  }
  .badge-running  { background: var(--badge-running-bg);  color: var(--badge-running-fg); }
  .badge-passed   { background: var(--badge-passed-bg);   color: var(--badge-passed-fg); }
  .badge-failed   { background: var(--badge-failed-bg);   color: var(--badge-failed-fg); }
  .badge-skipped  { background: var(--badge-skipped-bg);  color: var(--badge-skipped-fg); }
  .badge-pending  { background: var(--badge-pending-bg);  color: var(--badge-pending-fg); }

  .elapsed {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  .chevron {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.15s;
    user-select: none;
  }
  .chevron.open { transform: rotate(90deg); }

  /* Collapsible payload area */
  .card-body {
    display: none;
    padding: 0 0 8px 0;
  }
  .card-body.open { display: block; }

  .payload-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .payload-block pre {
    font-family: var(--font-mono);
    font-size: 11px;
    color: #a5b4d3;
    padding: 10px 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 520px;
    overflow-y: auto;
  }

  /* Long-form text fields (prompts, responses) — rendered as plain text with
     proper line breaks, not as JSON-escaped strings */
  .text-field-block {
    margin-bottom: 4px;
  }
  .text-field-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 8px 12px 2px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--code-bg);
  }
  .text-field-label .char-count {
    font-weight: 400;
    color: #4b5563;
    font-size: 10px;
  }
  .text-field-value {
    font-family: var(--font-mono);
    font-size: 11px;
    color: #c8d8f0;
    background: #0a0d14;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 480px;
    overflow-y: auto;
    line-height: 1.6;
  }

  /* Final verdict card (special styling) */
  .stage-card.final-verdict {
    border-left-color: transparent;
  }
  .stage-card.final-verdict .card-header {
    background: #131926;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 0;
  }
  .stage-card.final-verdict.status-passed .card-header {
    border-color: #166534;
    background: #0d1f0f;
  }
  .stage-card.final-verdict.status-failed .card-header {
    border-color: #7f1d1d;
    background: #1a0808;
  }

  /* ── Stage group dividers ────────────────────────────────────────────── */
  .stage-group-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 14px 0 4px 0;
    margin-left: 30px;
    opacity: 0.6;
  }

  /* ── Syntax highlighting helpers ────────────────────────────────────── */
  .hl-key    { color: #7dd3fc; }
  .hl-str    { color: #86efac; }
  .hl-num    { color: #fdba74; }
  .hl-bool   { color: #c084fc; }
  .hl-null   { color: #6366f1; }

  /* ── Responsive ─────────────────────────────────────────────────────── */
  @media (max-width: 680px) {
    .input-panel { width: 100%; position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .layout { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">⚡ NL2SQL Pipeline Live View</div>
    <div class="subtitle">Enterprise Oracle EBS — Observability Screen</div>
  </div>
  <div class="spacer"></div>
  <div id="traceIdBadge"></div>
</header>

<div class="layout">

  <!-- ── Input Panel ────────────────────────────────────────────────── -->
  <div class="input-panel">
    <div>
      <label for="sessionInput">Session ID</label>
      <input type="text" id="sessionInput" placeholder="my-session-001" value="trace-session-1"/>
    </div>
    <div>
      <label for="questionInput">Natural-language question</label>
      <textarea id="questionInput" placeholder="e.g. Aktif çalışanları listele"></textarea>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="payloadToggle" checked/>
      <label for="payloadToggle" style="text-transform:none;font-weight:normal;margin:0;">Show raw payloads</label>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitQuestion()">▶ Run Pipeline</button>
    <button class="btn-clear" onclick="clearTimeline()">✕ Clear</button>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn-clear" style="flex:1" onclick="expandAll()">⊞ Expand All</button>
      <button class="btn-clear" style="flex:1" onclick="collapseAll()">⊟ Collapse All</button>
    </div>
    <div class="status-indicator">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Ready</span>
    </div>
    <div class="payload-info">
      Completed stages auto-expand their payload.<br/>
      Click any card header to toggle it.
    </div>
  </div>

  <!-- ── Timeline ───────────────────────────────────────────────────── -->
  <div class="timeline" id="timeline">
    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon">🔭</div>
      <div class="placeholder-text">Ask a question to watch the pipeline run live</div>
    </div>
  </div>

</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────

const STAGE_LABELS = {
  question:                "Question",
  runtime_context:         "Runtime Context",
  metadata_catalog_load:   "Catalog Metadata",
  semantic_registry_load:  "Semantic Registry",
  document_corpus_load:    "Document Corpus",
  embedding_index_ready:   "Embedding Index",
  query_understanding:     "Query Understanding",
  embedding_request:       "Embedding Request",
  embedding_response:      "Embedding Response",
  schema_retrieval:        "Schema Retrieval",
  document_retrieval:      "Document Retrieval",
  retrieval_fusion:        "Retrieval Fusion",
  retrieval_assessment:    "Retrieval Assessment",
  prompt_assembly:         "Prompt Assembly",
  planner_llm_request:     "Planner LLM → Request",
  planner_llm_stream:      "Planner LLM → Streaming",
  planner_llm_response:    "Planner LLM → Response",
  planner_parsed_plan:     "Parsed QueryPlan",
  normalize:               "Normalize Plan",
  repair:                  "Structural Repair",
  semantic:                "Semantic Resolution",
  canonicalize:            "Canonicalize Columns",
  validation:              "Validation",
  compile:                 "SQL Compile",
  execute:                 "Execute",
  narrator_prompt:         "Narrator → Prompt",
  narrator_llm_stream:     "Narrator → Streaming",
  narrator_llm_response:   "Narrator → LLM Response",
  narrator_sanitize:       "Narrator → Sanitize",
  narrator_final_response: "Narrator → Final",
  final_verdict:           "Final Verdict",
};

const STAGE_GROUPS = {
  question:               "Input",
  runtime_context:        "Input",
  metadata_catalog_load:  "Environment",
  semantic_registry_load: "Environment",
  document_corpus_load:   "Environment",
  embedding_index_ready:  "Embedding / Index",
  query_understanding:    "Understanding",
  embedding_request:      "Embedding / Index",
  embedding_response:     "Embedding / Index",
  schema_retrieval:       "Retrieval",
  document_retrieval:     "Retrieval",
  retrieval_fusion:       "Retrieval",
  retrieval_assessment:   "Retrieval",
  prompt_assembly:        "Planning",
  planner_llm_request:    "Planning",
  planner_llm_stream:     "Planning",
  planner_llm_response:   "Planning",
  planner_parsed_plan:    "Planning",
  normalize:              "Plan Transform",
  repair:                 "Plan Transform",
  semantic:               "Plan Transform",
  canonicalize:           "Plan Transform",
  validation:             "Execution",
  compile:                "Execution",
  execute:                "Execution",
  narrator_prompt:        "Narration",
  narrator_llm_stream:    "Narration",
  narrator_llm_response:  "Narration",
  narrator_sanitize:      "Narration",
  narrator_final_response:"Narration",
  final_verdict:          "Result",
};

// ── State ──────────────────────────────────────────────────────────────────

let currentEventSource = null;
let stageCards = {};       // stageName → card DOM element
let lastGroup = null;

// ── Helpers ────────────────────────────────────────────────────────────────

function getLabel(stageName) {
  return STAGE_LABELS[stageName] || stageName.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function getGroup(stageName) {
  return STAGE_GROUPS[stageName] || '';
}

function badgeHtml(status) {
  const icons = { running: '⟳', passed: '✓', failed: '✗', skipped: '↷', pending: '○' };
  const icon = icons[status] || '?';
  return `<span class="badge badge-${status}">${icon} ${status}</span>`;
}

function elapsedHtml(ms) {
  if (ms === null || ms === undefined) return '';
  const s = ms >= 1000 ? `${(ms/1000).toFixed(2)}s` : `${ms}ms`;
  return `<span class="elapsed">${s}</span>`;
}

function syntaxHighlight(json) {
  // Simple JSON syntax highlighter
  const str = (typeof json === 'string') ? json : JSON.stringify(json, null, 2);
  return str
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*([eE][+-]?\d+)?)/g, match => {
      if (/^"/.test(match)) {
        if (/:$/.test(match)) return `<span class="hl-key">${match}</span>`;
        return `<span class="hl-str">${match}</span>`;
      }
      if (/true|false/.test(match)) return `<span class="hl-bool">${match}</span>`;
      if (/null/.test(match))       return `<span class="hl-null">${match}</span>`;
      return `<span class="hl-num">${match}</span>`;
    });
}

// Keys whose values should be rendered as readable plain text (with real line breaks)
// instead of JSON-escaped strings embedded in a JSON object.
const TEXT_FIELD_KEYS = new Set([
  'full_prompt_preview', 'prompt_preview', 'raw_response_preview',
  'sanitized_response_preview', 'question',
]);

// Keys that end in _char_count and pair with a TEXT_FIELD_KEY (used as label suffix)
const CHAR_COUNT_PAIRS = {
  'full_prompt_preview': 'full_prompt_char_count',
  'prompt_preview': 'prompt_char_count',
  'raw_response_preview': 'raw_response_char_count',
};

function escapeHtml(s) {
  return (s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textFieldHtml(key, value, charCountKey, payload) {
  const charCount = charCountKey ? (payload[charCountKey] ?? value.length) : value.length;
  const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
                   .replace(' Preview', '').replace(' Char Count', '');
  const countLabel = charCount > 0 ? `<span class="char-count">${charCount.toLocaleString()} chars</span>` : '';
  return `
    <div class="text-field-block">
      <div class="text-field-label">${escapeHtml(label)} ${countLabel}</div>
      <div class="text-field-value">${escapeHtml(value)}</div>
    </div>`;
}

function payloadHtml(payload) {
  if (!payload || Object.keys(payload).length === 0) return '';

  // Split payload into: text fields (rendered as plain text) + rest (rendered as JSON)
  const textEntries = [];
  const jsonPayload = {};
  const skipKeys = new Set();

  for (const key of Object.keys(payload)) {
    if (TEXT_FIELD_KEYS.has(key) && typeof payload[key] === 'string' && payload[key].length > 0) {
      const charCountKey = CHAR_COUNT_PAIRS[key] || null;
      textEntries.push({ key, value: payload[key], charCountKey });
      if (charCountKey) skipKeys.add(charCountKey);
    } else if (!skipKeys.has(key)) {
      jsonPayload[key] = payload[key];
    }
  }

  let html = '';

  // Render non-text fields as syntax-highlighted JSON
  const jsonKeys = Object.keys(jsonPayload).filter(k => !skipKeys.has(k));
  if (jsonKeys.length > 0) {
    try {
      const highlighted = syntaxHighlight(jsonPayload);
      html += `<div class="payload-block"><pre>${highlighted}</pre></div>`;
    } catch {
      html += `<div class="payload-block"><pre>${escapeHtml(JSON.stringify(jsonPayload, null, 2))}</pre></div>`;
    }
  }

  // Render text fields as readable plain text blocks
  for (const { key, value, charCountKey } of textEntries) {
    html += textFieldHtml(key, value, charCountKey, payload);
  }

  return html;
}

// ── Timeline rendering ─────────────────────────────────────────────────────

function clearTimeline() {
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
  stageCards = {};
  lastGroup = null;
  document.getElementById('timeline').innerHTML = `
    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon">🔭</div>
      <div class="placeholder-text">Ask a question to watch the pipeline run live</div>
    </div>`;
  setStatus('Ready', false);
  document.getElementById('traceIdBadge').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
}

function ensureGroupLabel(stageName) {
  const group = getGroup(stageName);
  if (!group || group === lastGroup) return;
  lastGroup = group;
  const el = document.createElement('div');
  el.className = 'stage-group-label';
  el.textContent = group;
  document.getElementById('timeline').appendChild(el);
}

function getOrCreateCard(stageName) {
  if (stageCards[stageName]) return stageCards[stageName];

  // Remove placeholder
  const ph = document.getElementById('placeholder');
  if (ph) ph.remove();

  ensureGroupLabel(stageName);

  const isFinal = stageName === 'final_verdict';
  const card = document.createElement('div');
  card.className = `stage-card status-pending${isFinal ? ' final-verdict' : ''}`;
  card.id = `card-${stageName}`;
  card.dataset.stageName = stageName;

  card.innerHTML = `
    <div class="card-header" onclick="toggleCard('${stageName}')">
      <span class="stage-title">${getLabel(stageName)}</span>
      ${badgeHtml('pending')}
      <span class="elapsed-slot"></span>
      <span class="chevron" id="chev-${stageName}">▶</span>
    </div>
    <div class="stage-summary" id="sum-${stageName}"></div>
    <div class="card-body" id="body-${stageName}"></div>
  `;

  document.getElementById('timeline').appendChild(card);
  stageCards[stageName] = card;
  return card;
}

function updateCard(event) {
  const card = getOrCreateCard(event.stage_name);
  const { status, summary, elapsed_ms, payload } = event;

  // Update status class
  card.className = card.className.replace(/status-\w+/, `status-${status}`);

  const header = card.querySelector('.card-header');

  // Re-set entire header HTML to avoid mutation complexity.
  // Preserve existing open/closed state of the body so chevron stays in sync.
  const isFinal = event.stage_name === 'final_verdict';
  const bodyElCheck = document.getElementById(`body-${event.stage_name}`);
  const wasOpen = bodyElCheck ? bodyElCheck.classList.contains('open') : false;

  header.innerHTML = `
    <span class="stage-title">${getLabel(event.stage_name)}</span>
    ${badgeHtml(status)}
    ${elapsedHtml(elapsed_ms)}
    <span class="chevron" id="chev-${event.stage_name}">▶</span>
  `;

  // Summary
  const sumEl = document.getElementById(`sum-${event.stage_name}`);
  if (sumEl && summary) sumEl.textContent = summary;

  // Payload (only if payloads enabled and there is payload)
  const showPayloads = document.getElementById('payloadToggle').checked;
  const bodyEl = document.getElementById(`body-${event.stage_name}`);
  if (bodyEl && showPayloads && payload && Object.keys(payload).length > 0) {
    bodyEl.innerHTML = payloadHtml(payload);
    // Auto-expand: always open completed stages that have payload, plus keep
    // any stage that was already open. Collapse only skipped/pending.
    const shouldOpen = wasOpen || status === 'running' || status === 'passed' || status === 'failed' || isFinal;
    if (shouldOpen && status !== 'skipped') {
      bodyEl.classList.add('open');
      const chev = document.getElementById(`chev-${event.stage_name}`);
      if (chev) chev.classList.add('open');
    }
  } else if (wasOpen && bodyEl) {
    // No new payload but was open before — keep it open, restore chevron
    bodyEl.classList.add('open');
    const chev = document.getElementById(`chev-${event.stage_name}`);
    if (chev) chev.classList.add('open');
  }

  // Scroll to new card if it's near the bottom
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function toggleCard(stageName) {
  const body = document.getElementById(`body-${stageName}`);
  const chev = document.getElementById(`chev-${stageName}`);
  if (!body) return;
  const isOpen = body.classList.toggle('open');
  if (chev) chev.classList.toggle('open', isOpen);
}

function expandAll() {
  document.querySelectorAll('.card-body').forEach(b => b.classList.add('open'));
  document.querySelectorAll('.chevron').forEach(c => c.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.card-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.chevron').forEach(c => c.classList.remove('open'));
}

// ── Streaming ──────────────────────────────────────────────────────────────

function setStatus(text, loading) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('spinner').style.display = loading ? 'block' : 'none';
}

async function submitQuestion() {
  const sessionId = document.getElementById('sessionInput').value.trim() || 'trace-session-1';
  const question  = document.getElementById('questionInput').value.trim();
  const includePayloads = document.getElementById('payloadToggle').checked;

  if (!question) { alert('Please enter a question.'); return; }

  // Close any existing stream
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

  clearTimeline();
  setStatus('Connecting…', true);
  document.getElementById('submitBtn').disabled = true;

  try {
    const resp = await fetch('/chat/trace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: question, include_payloads: includePayloads }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      setStatus(`Error: ${resp.status}`, false);
      document.getElementById('submitBtn').disabled = false;
      return;
    }

    // Show trace ID if present
    const traceId = resp.headers.get('X-Trace-Id');
    if (traceId) {
      const badge = document.getElementById('traceIdBadge');
      badge.textContent = `trace: ${traceId}`;
      badge.style.display = 'inline-flex';
    }

    setStatus('Pipeline running…', true);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // last partial line

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const raw = line.slice(6).trim();
          if (!raw) continue;
          try {
            const event = JSON.parse(raw);
            updateCard(event);
          } catch (e) {
            console.warn('Failed to parse SSE event:', raw, e);
          }
        }
        // SSE comments (": ...") are ignored — they're keepalive / status
      }
    }

    setStatus('Done ✓', false);
  } catch (err) {
    setStatus(`Connection error: ${err.message}`, false);
    console.error(err);
  }

  document.getElementById('submitBtn').disabled = false;
}

// Allow Ctrl+Enter / Cmd+Enter to submit
document.getElementById('questionInput').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitQuestion();
});
</script>
